services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: judikat-guard-db
    environment:
      POSTGRES_DB: judikat
      POSTGRES_USER: judikat
      POSTGRES_PASSWORD: judikat
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judikat -d judikat"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
