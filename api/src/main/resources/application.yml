# Judikát Guard API. PLAN.md sections 4 and 11.
#
# Every value here is overridable from the environment. Spring's relaxed binding means
# SPRING_DATASOURCE_URL also works; the JG_* names exist so that one set of variables
# configures both runtimes (see pipeline/jg/config.py, which reads JG_DB_URL).

spring:
  application:
    name: judikat-guard-api

  # The check endpoint is almost pure I/O: many small indexed reads plus, for the
  # proposition check, one model call. Platform threads buy nothing here (PLAN.md
  # section 4, "Java 25 specifics").
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${JG_JDBC_URL:jdbc:postgresql://localhost:55432/judikat}
    username: ${JG_DB_USER:judikat}
    password: ${JG_DB_PASSWORD:judikat}

  # Off because it buys nothing here and costs a proxy around every @Repository. It exists
  # to translate exceptions thrown by native persistence APIs (JPA, Hibernate), and this
  # project has none: JdbcClient already surfaces Spring's DataAccessException hierarchy.
  # Leaving it on would also mean every repository had to stop being final, purely so that
  # CGLIB could subclass it.
  persistence:
    exceptiontranslation:
      enabled: false

  # Flyway owns the schema (D6). It runs on startup as well as from `make migrate`, so a
  # freshly cloned checkout needs one command rather than two.
  flyway:
    enabled: true
    locations: classpath:db/migration

# The schema, on the same /api prefix as everything else so one Vite proxy rule covers it.
springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs

logging:
  level:
    tech.judikatguard: INFO
